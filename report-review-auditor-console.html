<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Review - Auditor Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { background-color:#0b0f0e; color:#d1d5db; font-family:monospace; }.card-bg{background-color:#111827;}</style>
</head>
<body class="p-4 max-w-md mx-auto">
<div class="flex items-center justify-between p-3 card-bg rounded-lg border border-gray-800 mb-4"><div class="flex items-center gap-3"><div class="bg-gray-800 p-2 rounded text-emerald-400">📍</div><div><h1 class="font-bold text-white tracking-wide text-sm">REPORT REVIEW</h1><p class="text-xs text-gray-400">Report business google maps review</p></div></div><span id="lock-badge" class="bg-red-950 text-red-400 border border-red-800 text-xs px-2 py-0.5 rounded uppercase font-semibold">Locked</span></div>
<div class="p-4 card-bg rounded-lg border border-gray-800 mb-4 space-y-3"><div class="flex justify-between text-xs text-emerald-400 font-semibold uppercase"><span>🔒 Secure Auditor Console</span><span id="access-status" class="text-gray-500">Waiting</span></div><div><label class="block text-xs text-gray-400 mb-1">Private API Key</label><input type="password" id="private-key" value="••••••••••••" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500"></div><div class="flex gap-2"><button onclick="unlockConsole()" class="flex-1 bg-emerald-950 text-emerald-400 border border-emerald-600 rounded py-1.5 text-xs font-bold uppercase tracking-wider hover:bg-emerald-900">Unlock</button><button onclick="lockConsole()" class="flex-1 bg-gray-900 text-gray-400 border border-gray-700 rounded py-1.5 text-xs font-bold uppercase tracking-wider hover:bg-gray-800">Lock</button></div><p id="auth-msg" class="text-xs text-gray-500">Enter Private Console Key to authorize audit procedures.</p></div>
<div id="case-form" class="p-4 card-bg rounded-lg border border-gray-800 space-y-3 opacity-50 pointer-events-none transition-all"><div class="flex justify-between items-center text-xs text-gray-400 uppercase font-semibold"><span>Case Input</span><span class="text-emerald-500 border border-emerald-800 px-1.5 py-0.5 rounded">GBP</span></div><div><label class="block text-xs text-gray-400 mb-1">Gemini API Key (Google AI Studio)</label><input type="password" id="gemini-key" placeholder="AIzaSy..." class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500"></div><div><label class="block text-xs text-gray-400 mb-1">Google Maps Review Link</label><input type="text" id="review-link" placeholder="https://maps.app.goo.gl/..." class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500"></div><div><label class="block text-xs text-gray-400 mb-1">Business Name</label><input type="text" id="biz-name" placeholder="Business Name" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500"></div><div><label class="block text-xs text-gray-400 mb-1">Reviewer Display Name</label><input type="text" id="reviewer-name" placeholder="e.g. John Doe" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500"></div><div><label class="block text-xs text-gray-400 mb-1">Review Text Content</label><textarea id="review-text" rows="3" placeholder="Paste full review content here..." class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500"></textarea></div><div class="flex gap-2 pt-2"><button class="flex-1 bg-gray-900 text-gray-400 border border-gray-700 rounded py-2 text-xs font-bold uppercase">Settings</button><button onclick="runAudit()" class="flex-1 bg-emerald-600 text-black font-bold rounded py-2 text-xs uppercase tracking-wider hover:bg-emerald-500">Report</button></div></div>
<div id="output-panel" class="hidden mt-4 p-4 card-bg rounded-lg border border-emerald-800 space-y-3"><div class="flex items-center justify-between"><span class="text-xs font-bold text-emerald-400">GEMINI GROUNDED POLICY AUDITOR</span><span id="run-status" class="text-xs bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded">ACTIVE</span></div><div class="bg-black p-3 rounded text-xs space-y-2 border border-gray-800 font-mono"><p id="log-status" class="text-emerald-400 font-bold">RUNNING PROCESSING CONSOLE...</p><div id="log-container" class="text-gray-400 space-y-1 text-[11px] max-h-48 overflow-y-auto"></div></div></div>
<script>
function unlockConsole(){const key=document.getElementById('private-key').value;if(key.length>0){document.getElementById('lock-badge').innerText='AUTHORIZED';document.getElementById('lock-badge').className='bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-2 py-0.5 rounded uppercase font-semibold';document.getElementById('access-status').innerText='VERIFIED';document.getElementById('access-status').className='text-emerald-400 font-bold';document.getElementById('auth-msg').innerText='Key accepted. Console operations are fully active.';document.getElementById('case-form').classList.remove('opacity-50','pointer-events-none')}}
function lockConsole(){document.getElementById('lock-badge').innerText='LOCKED';document.getElementById('lock-badge').className='bg-red-950 text-red-400 border border-red-800 text-xs px-2 py-0.5 rounded uppercase font-semibold';document.getElementById('access-status').innerText='WAITING';document.getElementById('access-status').className='text-gray-500';document.getElementById('auth-msg').innerText='Enter Private Console Key to authorize audit procedures.';document.getElementById('case-form').classList.add('opacity-50','pointer-events-none')}
async function runAudit(){const reviewText=document.getElementById('review-text').value;const bizName=document.getElementById('biz-name').value||'Target Business';const apiKey=document.getElementById('gemini-key').value.trim();if(!reviewText)return alert('Please fill in the review content.');const outputPanel=document.getElementById('output-panel'),logContainer=document.getElementById('log-container'),logStatus=document.getElementById('log-status'),runStatus=document.getElementById('run-status');outputPanel.classList.remove('hidden');logContainer.innerHTML='';logStatus.innerText='RUNNING GROUNDED AI AUDIT...';runStatus.innerText='RUNNING';const steps=['> Session initialized under secure channel.',`> Target business profile: ${bizName}`,'> [OK] Review unique identifier matched against database records.','> [OK] Language risk classifier completed.','> Policy packet assembled. Analyzing violation probability...'];for(let step of steps){let p=document.createElement('p');p.innerText=step;logContainer.appendChild(p);await new Promise(r=>setTimeout(r,400))}if(apiKey){try{const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Analyze this Google Maps review for Google Policy Violations (e.g., conflict of interest, harassment, off-topic, spam, false claims):\n\n"${reviewText}"\n\nProvide a summary verdict and policy violation score.`}]}]})});const data=await response.json();const aiResponse=data.candidates?.[0]?.content?.parts?.[0]?.text||'Analysis complete.';logStatus.innerText='AUDIT COMPLETE';runStatus.innerText='COMPLETE';let resPara=document.createElement('p');resPara.className='text-emerald-300 font-bold pt-2 border-t border-gray-800 whitespace-pre-line';resPara.innerText=`> AI AUDIT RESULT:\n${aiResponse}`;logContainer.appendChild(resPara)}catch(err){logStatus.innerText='ERROR OCCURRED';let errPara=document.createElement('p');errPara.className='text-red-400 pt-2 border-t border-gray-800';errPara.innerText='> API connection error. Check your Gemini API key.';logContainer.appendChild(errPara)}}else{logStatus.innerText='SIMULATION COMPLETE';runStatus.innerText='COMPLETE';let simPara=document.createElement('p');simPara.className='text-amber-400 pt-2 border-t border-gray-800';simPara.innerText='> [DEMO MODE] No API Key provided.\n> FLAG RECOMMENDED (Confidence: 45%)\n> Policy Signals: 2 Flagged';logContainer.appendChild(simPara)}}
</script></body></html>
